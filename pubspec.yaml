name: dart_quiche
description: >-
  Pure-Dart port of Cloudflare's quiche QUIC + HTTP/3 stack: TLS 1.3,
  packet protection, loss recovery, congestion control, HTTP/3, QPACK
  and WebTransport on top of pointycastle. No FFI, no BoringSSL.
version: 0.1.0-dev.1
homepage: https://github.com/KellyKinyama/dart-quiche
repository: https://github.com/KellyKinyama/dart-quiche
issue_tracker: https://github.com/KellyKinyama/dart-quiche/issues

environment:
  sdk: ^3.11.0-296.4.beta

dependencies:
  pointycastle: ^4.0.0
  pure_dart_quic:
    path: ../pure-dart-quic

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
