name: dart_quiche
description: >-
  Pure-Dart port of Cloudflare's quiche QUIC + HTTP/3 stack.
  Currently covers the wire-format layer (octets, frames, ranges).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0-296.4.beta

dependencies:
  pointycastle: ^4.0.0
  pure_dart_quic:
    path: ../pure-dart-quic

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
